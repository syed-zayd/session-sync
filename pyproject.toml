[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sessync"
version = "0.2.0"
description = "Move coding-agent sessions between Claude Code, Codex, Kiro and Antigravity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "Zayd Syed" }]
keywords = ["claude-code", "codex", "kiro", "antigravity", "ai-agents", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/syed-zayd/session-sync"
Issues = "https://github.com/syed-zayd/session-sync/issues"

[project.scripts]
# Hooks run in the tool's own working directory, so mirroring has to be
# reachable as a plain command rather than `python -m` from the source tree.
sessync = "sessync.cli:main"

[tool.setuptools]
packages = ["sessync", "sessync.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
